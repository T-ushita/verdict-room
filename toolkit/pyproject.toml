[project]
name = "verdict-room"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
verdict = "verdict.cli:main"
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["verdict"]
[tool.ruff]
line-length = 100
