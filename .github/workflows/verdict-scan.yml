name: Verdict Room scheduled PR scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore PR state
        uses: actions/cache@v4
        with:
          path: cases/pr-state.json
          key: verdict-pr-state-${{ github.run_id }}
          restore-keys: |
            verdict-pr-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan changed PRs
        env:
          VERDICT_REPO: sandbox-quantum/switch
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd toolkit
          python -m verdict.cli scan --repo "$VERDICT_REPO"
          echo "### Verdict Room scan summary" >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json; from pathlib import Path; s=json.loads(Path("../cases/scan-summary.json").read_text()); print("- Changed/new PRs: %d" % s["changed_count"]); print("- Unchanged PRs: %d" % s["unchanged_count"]); print("- Affected issues: %s" % s["affected_issues"])' >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json; from pathlib import Path; s=json.loads(Path("../cases/scan-summary.json").read_text()); [print("- PR #%d [%s]: %s" % (i["number"], i["status"], i["title"])) for i in s["changed"]]' >> "$GITHUB_STEP_SUMMARY"
