<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verdict Room Docket</title>
  <style>
    :root { --bg:#eef1f4; --panel:#fff; --ink:#1b2430; --muted:#5d6b7c; --line:#d5dce4; --ok:#1d7a6c; --warn:#a96a0b; --bad:#b0342c; --accent:#2f4f86; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,sans-serif; }
    header { padding:20px 28px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
    h1 { margin:0; font:600 24px Georgia,serif; }
    .layout { display:grid; grid-template-columns:280px minmax(0,1fr); min-height:calc(100vh - 80px); }
    aside { padding:16px; border-right:1px solid var(--line); }
    main { padding:20px 28px 40px; }
    .case-card, .pr, .row, .draft { background:var(--panel); border:1px solid var(--line); border-radius:6px; }
    .case-card { width:100%; text-align:left; margin-bottom:8px; padding:10px 12px; cursor:pointer; color:var(--ink); }
    .case-card.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .meta { color:var(--muted); font-size:13px; }
    .prs { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:16px; }
    .pr { overflow:hidden; }
    .pr header { padding:12px 14px; }
    .pr h2 { margin:0 0 4px; font:600 17px Georgia,serif; }
    .row { margin:8px; padding:10px 12px; border-left:4px solid var(--muted); }
    .row.VERIFIED { border-left-color:var(--ok); } .row.UNVERIFIED { border-left-color:var(--warn); } .row.CONTRADICTED { border-left-color:var(--bad); }
    .status { font-weight:700; font-size:12px; }
    .status.VERIFIED { color:var(--ok); } .status.UNVERIFIED { color:var(--warn); } .status.CONTRADICTED { color:var(--bad); }
    a { color:var(--accent); }
    .draft { margin-top:16px; padding:14px; }
    textarea { width:100%; min-height:160px; resize:vertical; border:1px solid var(--line); padding:10px; font:14px/1.45 ui-monospace,monospace; }
    input, select { border:1px solid var(--line); padding:7px; font:inherit; }
    button { border:1px solid var(--accent); background:transparent; color:var(--accent); border-radius:4px; padding:7px 12px; cursor:pointer; }
    button.primary { background:var(--accent); color:white; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; align-items:center; }
    .error { color:var(--bad); }
  </style>
</head>
<body>
  <header><h1>Verdict Room Docket</h1><div class="meta" id="connection"></div></header>
  <div class="layout">
    <aside><h2>Cases</h2><div id="cases">Loading…</div></aside>
    <main><div id="case">Select a case.</div></main>
  </div>
  <script>
    const TOKEN = __VERDICT_SESSION_TOKEN__;
    const OUTCOMES = ["Prefer one PR", "Ask authors to merge efforts", "Request changes", "Flag duplicate", "Hold"];
    let currentIssue = null;
    let currentData = null;

    async function api(path, options = {}) {
      const headers = Object.assign({"X-Verdict-Token": TOKEN}, options.headers || {});
      if (options.body) headers["Content-Type"] = "application/json";
      const response = await fetch(path, Object.assign({}, options, {headers}));
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }
    function esc(value) {
      return String(value ?? "")
        .replace(/â€”|â€“/g, "-")
        .replace(/[—–]/g, "-")
        .replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    }
    async function loadCases() {
      try {
        const data = await api("/api/cases");
        document.getElementById("cases").innerHTML = data.cases.length ? data.cases.map(item => `
          <button class="case-card" data-issue="${item.issue}">
            <strong>#${item.issue}</strong><br>${esc(item.title || "Untitled case")}<br>
            <span class="meta">${item.pr_count} PRs | ${item.ledger_rows} ledger rows | ${esc(item.source)}</span>
          </button>`).join("") : `<span class="meta">No cases found.</span>`;
        document.querySelectorAll(".case-card").forEach(button => button.onclick = () => loadCase(Number(button.dataset.issue)));
        document.getElementById("connection").textContent = "Local Docket | API connected";
        if (data.cases.length) loadCase(data.cases[0].issue);
      } catch (error) {
        document.getElementById("cases").innerHTML = `<span class="error">${esc(error.message)}</span>`;
      }
    }
    async function loadCase(issue) {
      currentIssue = issue;
      document.querySelectorAll(".case-card").forEach(button => button.classList.toggle("active", Number(button.dataset.issue) === issue));
      try {
        currentData = await api(`/api/cases/${issue}/ledger`);
        renderCase(currentData);
      } catch (error) {
        document.getElementById("case").innerHTML = `<span class="error">${esc(error.message)}</span>`;
      }
    }
    function renderCase(data) {
      const caseData = data.case;
      const prs = caseData.prs || [];
      const ledgerByPr = {};
      for (const row of data.ledger) (ledgerByPr[row.pr] ||= []).push(row);
      document.getElementById("case").innerHTML = `
        <h2>Issue #${data.issue}: ${esc(caseData.issue_title)}</h2>
        <div class="meta">${esc(caseData.source)} | ${prs.length} competing PRs | room verdict-${data.issue}</div>
        <div class="prs">${prs.map(pr => {
          const rows = ledgerByPr[pr.number] || [];
          const existingDraft = data.drafts[String(pr.number)] || defaultDraft(pr, rows);
          return `<article class="pr">
            <header><h2>#${pr.number} ${esc(pr.title)}</h2><div class="meta">${esc(pr.author)} | ${esc(pr.state)}${pr.draft ? " | draft" : ""}</div></header>
            ${rows.map(row => `<div class="row ${row.status}">
              <div class="status ${row.status}">${esc(row.status)}</div>
              <div><strong>${esc(row.claim)}</strong></div>
              <div class="meta">${esc(row.rationale || "No agent rationale recorded.")}</div>
              <div>${[...(new Set((row.evidence_links || []).filter(Boolean)))].map(link => `<a href="${esc(link)}" target="_blank" rel="noopener">Evidence</a>`).join(" | ") || "No evidence links"}</div>
              <details><summary>Override / note</summary>
                <select id="status-${row.claim_id}">
                  ${["VERIFIED","UNVERIFIED","CONTRADICTED","NOT_CHECKABLE"].map(status => `<option ${row.status === status ? "selected" : ""}>${status}</option>`).join("")}
                </select>
                <input id="approver-${row.claim_id}" placeholder="Approver name">
                <input id="note-${row.claim_id}" placeholder="Reason for override">
                <button onclick="saveOverride('${esc(row.claim_id)}')">Save override</button>
              </details>
            </div>`).join("") || `<div class="row">No ledger rows.</div>`}
            <div class="draft">
              <label><strong>Comment draft</strong></label>
              <textarea id="draft-${pr.number}">${esc(existingDraft)}</textarea>
              <div class="actions">
                <button onclick="saveDraft(${pr.number})">Save draft</button>
                <select id="outcome-${pr.number}">${OUTCOMES.map(outcome => `<option>${esc(outcome)}</option>`).join("")}</select>
                <input id="approver-${pr.number}" placeholder="Approver name">
                <button class="primary" onclick="approveDraft(${pr.number})">Approve</button>
              </div>
              <div class="meta" id="result-${pr.number}"></div>
            </div>
          </article>`;
        }).join("")}</div>`;
    }
    function defaultDraft(pr, rows) {
      const outcomes = rows.length ? rows.map(row => `- ${row.claim_id}: ${row.status} - ${row.claim}`).join("\n") : "- No evidence ledger rows available.";
      return `Verdict Room summary for #${pr.number} ${pr.title}\n\nEvidence-ledger findings:\n${outcomes}\n\nPlease request changes or hold posting until the evidence gaps are resolved.`;
    }
    async function saveDraft(pr) {
      const draft = document.getElementById(`draft-${pr}`).value;
      try {
        const result = await api(`/api/cases/${currentIssue}/draft`, {method:"POST", body:JSON.stringify({pr, draft})});
        document.getElementById(`result-${pr}`).textContent = `Saved draft ${result.draft_hash}`;
      } catch (error) { document.getElementById(`result-${pr}`).textContent = error.message; }
    }
    async function approveDraft(pr) {
      const draft = document.getElementById(`draft-${pr}`).value;
      const outcome = document.getElementById(`outcome-${pr}`).value;
      const approver = document.getElementById(`approver-${pr}`).value.trim();
      if (!approver) {
        document.getElementById(`result-${pr}`).textContent = "Approver name is required.";
        return;
      }
      try {
        const result = await api(`/api/cases/${currentIssue}/approve`, {method:"POST", body:JSON.stringify({pr, draft, outcome, approver})});
        document.getElementById(`result-${pr}`).textContent = `Approved by ${esc(result.approver)} | ${result.draft_hash}`;
      } catch (error) { document.getElementById(`result-${pr}`).textContent = error.message; }
    }
    async function saveOverride(claimId) {
      const status = document.getElementById(`status-${claimId}`).value;
      const note = document.getElementById(`note-${claimId}`).value.trim();
      const approver = document.getElementById(`approver-${claimId}`).value.trim();
      try {
        await api(`/api/cases/${currentIssue}/override`, {method:"POST", body:JSON.stringify({claim_id:claimId, status, note, approver})});
        await loadCase(currentIssue);
      } catch (error) { alert(error.message); }
    }
    loadCases();
  </script>
</body>
</html>
